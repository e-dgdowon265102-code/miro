<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미로 게임 - 난이도 1~50</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100svh;
    background: linear-gradient(-45deg, #0f172a, #1e1b4b, #082f49, #1e1b4b);
    background-size: 300% 300%;
    animation: bgshift 16s ease infinite;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(10px, 4vw, 20px);
  }
  @keyframes bgshift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .card {
    position: relative;
    background: rgba(15, 23, 42, 0.78);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 20px;
    border: 1px solid rgba(148, 163, 184, 0.18);
    padding: clamp(18px, 4vw, 26px) clamp(16px, 5vw, 30px) clamp(22px, 5vw, 32px);
    box-shadow: 0 25px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(56,189,248,0.05);
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(10px, 2.5vw, 14px);
    animation: cardIn 0.5s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(14px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  h1 {
    font-size: clamp(18px, 4.5vw, 22px);
    margin: 0;
    font-weight: 700;
    text-align: center;
    background: linear-gradient(90deg, #38bdf8, #a78bfa, #f472b6);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: hueflow 6s linear infinite;
    letter-spacing: 0.5px;
  }
  @keyframes hueflow {
    to { background-position: 200% center; }
  }

  .level-row {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
  }
  .level-row label { font-size: 13px; color: #94a3b8; white-space: nowrap; }
  .level-row span { font-weight: 700; min-width: 28px; text-align: right; color: #e2e8f0; }

  input[type=range] {
    flex: 1;
    min-width: 0;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    border-radius: 4px;
    background: linear-gradient(90deg, #38bdf8, #a78bfa);
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #f8fafc;
    border: 3px solid #a78bfa;
    box-shadow: 0 0 8px rgba(167,139,250,0.8);
    cursor: pointer;
    transition: transform 0.15s;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.15); }
  input[type=range]::-moz-range-thumb {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #f8fafc;
    border: 3px solid #a78bfa;
    box-shadow: 0 0 8px rgba(167,139,250,0.8);
    cursor: pointer;
  }

  #tier {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 600;
    letter-spacing: 0.3px;
    transition: background 0.3s, color 0.3s;
  }

  .stats {
    display: flex;
    gap: clamp(14px, 4vw, 22px);
    font-size: 13px;
    color: #94a3b8;
    flex-wrap: wrap;
    justify-content: center;
  }
  .stats b { color: #f1f5f9; font-variant-numeric: tabular-nums; }

  .canvas-wrap {
    position: relative;
    width: 100%;
    max-width: 420px;
    aspect-ratio: 1 / 1;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(148,163,184,0.25), 0 8px 24px rgba(0,0,0,0.4);
    background: #0b1220;
  }
  canvas { display: block; width: 100%; height: 100%; }

  #confettiLayer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: visible;
  }
  .confetti {
    position: absolute;
    top: -10px;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    opacity: 0.95;
    animation-name: confettiFall;
    animation-timing-function: cubic-bezier(.3,.6,.7,1);
    animation-fill-mode: forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(340px) rotate(540deg); opacity: 0; }
  }

  #winMsg {
    display: none;
    font-size: clamp(14px, 4vw, 16px);
    font-weight: 700;
    color: #34d399;
    text-align: center;
    animation: winPulse 1s ease infinite;
  }
  @keyframes winPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button {
    border: 1px solid rgba(148,163,184,0.25);
    background: rgba(51, 65, 85, 0.55);
    color: #e2e8f0;
    border-radius: 10px;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s, box-shadow 0.2s;
    touch-action: manipulation;
  }
  button:hover { background: rgba(71, 85, 105, 0.75); box-shadow: 0 0 12px rgba(56,189,248,0.25); }
  button:active { transform: scale(0.94); }

  .dpad-grid {
    display: grid;
    grid-template-columns: repeat(3, clamp(40px, 12vw, 48px));
    grid-template-rows: repeat(3, clamp(40px, 12vw, 48px));
    gap: 5px;
    margin-top: 4px;
  }
  .dpad {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(17px, 4.5vw, 20px);
    font-weight: 700;
    padding: 0;
  }

  @media (max-width: 380px) {
    .stats { gap: 12px; font-size: 12px; }
    .level-row label { font-size: 12px; }
  }
  @media (hover: none) {
    button:hover { background: rgba(51, 65, 85, 0.55); box-shadow: none; }
  }
</style>
</head>
<body>
<div class="card">
  <h1>미로 게임</h1>

  <div class="level-row">
    <label for="lvl">난이도</label>
    <input type="range" id="lvl" min="1" max="50" value="1" step="1">
    <span id="lvlOut">1</span>
    <span id="tier">쉬움</span>
  </div>

  <div class="stats">
    <span>이동 <b id="moves">0</b></span>
    <span>시간 <b id="time">0초</b></span>
  </div>

  <div class="canvas-wrap">
    <canvas id="cv"></canvas>
    <div id="confettiLayer"></div>
  </div>

  <div id="winMsg">클리어! 다음 레벨로 가보세요.</div>

  <div class="btn-row">
    <button id="restartBtn">다시 시작</button>
    <button id="nextBtn">다음 레벨</button>
  </div>

  <div class="dpad-grid">
    <div></div>
    <button class="dpad" data-dir="up">▲</button>
    <div></div>
    <button class="dpad" data-dir="left">◀</button>
    <div></div>
    <button class="dpad" data-dir="right">▶</button>
    <div></div>
    <button class="dpad" data-dir="down">▼</button>
    <div></div>
  </div>
</div>

<script>
(function(){
  var lvlInput = document.getElementById('lvl');
  var lvlOut = document.getElementById('lvlOut');
  var tierEl = document.getElementById('tier');
  var movesEl = document.getElementById('moves');
  var timeEl = document.getElementById('time');
  var winMsg = document.getElementById('winMsg');
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var canvasWrap = document.querySelector('.canvas-wrap');
  var confettiLayer = document.getElementById('confettiLayer');
  var restartBtn = document.getElementById('restartBtn');
  var nextBtn = document.getElementById('nextBtn');

  var level, cols, rows, cell, grid, px, py, moves, won, startTime, timerId;
  var animX = 0, animY = 0, visRadius = 8;
  var trail = [];
  var CANVAS_SIZE = 420;
  var dpr = window.devicePixelRatio || 1;

  function sizeForLevel(l){
    var s = 5 + Math.floor((l-1) * 1.1);
    if (s > 60) s = 60;
    return s;
  }
  function radiusForLevel(l){
    var r = 7 - l * 0.1;
    if (r < 2.0) r = 2.0;
    return r;
  }
  function tierForLevel(l){
    if (l <= 8) return ['쉬움', '#34d399', 'rgba(52,211,153,0.15)'];
    if (l <= 20) return ['보통', '#38bdf8', 'rgba(56,189,248,0.15)'];
    if (l <= 32) return ['어려움', '#fb923c', 'rgba(251,146,60,0.15)'];
    if (l <= 44) return ['매우 어려움', '#f472b6', 'rgba(244,114,182,0.18)'];
    return ['극한', '#ef4444', 'rgba(239,68,68,0.2)'];
  }

  function currentDisplaySize(){
    return Math.max(200, Math.round(canvasWrap.clientWidth));
  }
  function applyCanvasSize(){
    CANVAS_SIZE = currentDisplaySize();
    cell = CANVAS_SIZE / cols;
    cv.width = CANVAS_SIZE * dpr;
    cv.height = CANVAS_SIZE * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function makeGrid(c, r){
    var g = [];
    for (var y=0; y<r; y++){
      var row = [];
      for (var x=0; x<c; x++){
        row.push({x:x, y:y, top:true, right:true, bottom:true, left:true, visited:false});
      }
      g.push(row);
    }
    return g;
  }

  function generateMaze(c, r){
    var g = makeGrid(c, r);
    var stack = [];
    var cur = g[0][0];
    cur.visited = true;
    stack.push(cur);
    while (stack.length){
      cur = stack[stack.length-1];
      var neighbors = [];
      var x = cur.x, y = cur.y;
      if (y > 0 && !g[y-1][x].visited) neighbors.push(['top', g[y-1][x]]);
      if (x < c-1 && !g[y][x+1].visited) neighbors.push(['right', g[y][x+1]]);
      if (y < r-1 && !g[y+1][x].visited) neighbors.push(['bottom', g[y+1][x]]);
      if (x > 0 && !g[y][x-1].visited) neighbors.push(['left', g[y][x-1]]);
      if (neighbors.length === 0){
        stack.pop();
        continue;
      }
      var pick = neighbors[Math.floor(Math.random()*neighbors.length)];
      var dir = pick[0], next = pick[1];
      if (dir === 'top'){ cur.top = false; next.bottom = false; }
      if (dir === 'right'){ cur.right = false; next.left = false; }
      if (dir === 'bottom'){ cur.bottom = false; next.top = false; }
      if (dir === 'left'){ cur.left = false; next.right = false; }
      next.visited = true;
      stack.push(next);
    }
    return g;
  }

  function draw(ts){
    ctx.clearRect(0,0,CANVAS_SIZE,CANVAS_SIZE);
    ctx.fillStyle = '#0b1220';
    ctx.fillRect(0,0,CANVAS_SIZE,CANVAS_SIZE);

    ctx.strokeStyle = '#475569';
    ctx.lineWidth = Math.max(1.5, cell*0.06);
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (var y=0; y<rows; y++){
      for (var x=0; x<cols; x++){
        var c = grid[y][x];
        var x0 = x*cell, y0 = y*cell, x1 = x0+cell, y1 = y0+cell;
        if (c.top){ ctx.moveTo(x0,y0); ctx.lineTo(x1,y0); }
        if (c.right){ ctx.moveTo(x1,y0); ctx.lineTo(x1,y1); }
        if (c.bottom){ ctx.moveTo(x0,y1); ctx.lineTo(x1,y1); }
        if (c.left){ ctx.moveTo(x0,y0); ctx.lineTo(x0,y1); }
      }
    }
    ctx.stroke();

    var pulse = won ? 1 : (0.5 + 0.5*Math.sin((ts||0)/280));
    var gx = (cols-1)*cell + cell/2;
    var gy = (rows-1)*cell + cell/2;
    ctx.save();
    ctx.shadowColor = '#34d399';
    ctx.shadowBlur = 8 + pulse*14;
    ctx.fillStyle = '#34d399';
    var gpad = cell*0.22;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect((cols-1)*cell+gpad, (rows-1)*cell+gpad, cell-gpad*2, cell-gpad*2, cell*0.15)
                  : ctx.rect((cols-1)*cell+gpad, (rows-1)*cell+gpad, cell-gpad*2, cell-gpad*2);
    ctx.fill();
    ctx.restore();

    var now = performance.now();
    for (var i=0; i<trail.length; i++){
      var tpt = trail[i];
      var age = (now - tpt.t) / 700;
      if (age >= 1) continue;
      ctx.beginPath();
      ctx.fillStyle = 'rgba(56,189,248,' + (0.35*(1-age)) + ')';
      ctx.arc(tpt.x*cell + cell/2, tpt.y*cell + cell/2, cell*0.14*(1-age*0.4), 0, Math.PI*2);
      ctx.fill();
    }

    var pcx = animX*cell + cell/2;
    var pcy = animY*cell + cell/2;
    ctx.save();
    ctx.shadowColor = '#38bdf8';
    ctx.shadowBlur = 14;
    var grad = ctx.createRadialGradient(pcx, pcy, 0, pcx, pcy, cell*0.32);
    grad.addColorStop(0, '#7dd3fc');
    grad.addColorStop(1, '#0284c7');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(pcx, pcy, cell*0.3, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    if (!won && visRadius < 30) {
      var fog = ctx.createRadialGradient(pcx, pcy, visRadius*cell*0.5, pcx, pcy, visRadius*cell);
      fog.addColorStop(0, 'rgba(11,18,32,0)');
      fog.addColorStop(0.7, 'rgba(11,18,32,0.1)');
      fog.addColorStop(1, 'rgba(11,18,32,0.28)');
      ctx.fillStyle = fog;
      ctx.fillRect(0,0,CANVAS_SIZE,CANVAS_SIZE);
    }
  }

  function loop(ts){
    var ease = 0.28;
    animX += (px - animX) * ease;
    animY += (py - animY) * ease;
    if (Math.abs(px-animX) < 0.01) animX = px;
    if (Math.abs(py-animY) < 0.01) animY = py;
    draw(ts);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function updateStats(){
    movesEl.textContent = moves;
  }
  function startTimer(){
    stopTimer();
    startTime = Date.now();
    timerId = setInterval(function(){
      var s = Math.floor((Date.now()-startTime)/1000);
      timeEl.textContent = s + '초';
    }, 500);
  }
  function stopTimer(){
    if (timerId) clearInterval(timerId);
    timerId = null;
  }

  function updateTierUI(l){
    var t = tierForLevel(l);
    tierEl.textContent = t[0];
    tierEl.style.color = t[1];
    tierEl.style.background = t[2];
  }

  function launchConfetti(){
    confettiLayer.innerHTML = '';
    var colors = ['#38bdf8', '#a78bfa', '#f472b6', '#34d399', '#fbbf24'];
    for (var i=0; i<26; i++){
      var el = document.createElement('div');
      el.className = 'confetti';
      el.style.left = (Math.random()*100) + '%';
      el.style.background = colors[Math.floor(Math.random()*colors.length)];
      el.style.animationDuration = (900 + Math.random()*700) + 'ms';
      el.style.animationDelay = (Math.random()*250) + 'ms';
      confettiLayer.appendChild(el);
    }
    setTimeout(function(){ confettiLayer.innerHTML = ''; }, 2000);
  }

  function newGame(l){
    level = l;
    lvlInput.value = l;
    lvlOut.textContent = l;
    updateTierUI(l);
    var s = sizeForLevel(l);
    cols = s; rows = s;
    visRadius = radiusForLevel(l);
    applyCanvasSize();
    grid = generateMaze(cols, rows);
    px = 0; py = 0;
    animX = 0; animY = 0;
    trail = [];
    moves = 0;
    won = false;
    winMsg.style.display = 'none';
    confettiLayer.innerHTML = '';
    updateStats();
    startTimer();
  }

  function tryMove(dir){
    if (won) return;
    var c = grid[py][px];
    var nx = px, ny = py;
    if (dir === 'up' && !c.top) ny -= 1;
    else if (dir === 'down' && !c.bottom) ny += 1;
    else if (dir === 'left' && !c.left) nx -= 1;
    else if (dir === 'right' && !c.right) nx += 1;
    else return;
    trail.push({x:px, y:py, t:performance.now()});
    if (trail.length > 20) trail.shift();
    px = nx; py = ny;
    moves += 1;
    updateStats();
    if (px === cols-1 && py === rows-1){
      won = true;
      stopTimer();
      winMsg.style.display = 'block';
      launchConfetti();
    }
  }

  var resizeTimer = null;
  window.addEventListener('resize', function(){
    if (!grid) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(applyCanvasSize, 100);
  });

  document.addEventListener('keydown', function(e){
    var map = {ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right', w:'up', s:'down', a:'left', d:'right'};
    var dir = map[e.key];
    if (dir){
      e.preventDefault();
      tryMove(dir);
    }
  });

  document.querySelectorAll('.dpad').forEach(function(btn){
    btn.addEventListener('click', function(){
      tryMove(btn.getAttribute('data-dir'));
    });
  });

  lvlInput.addEventListener('input', function(){
    lvlOut.textContent = lvlInput.value;
    updateTierUI(parseInt(lvlInput.value, 10));
  });
  lvlInput.addEventListener('change', function(){
    newGame(parseInt(lvlInput.value, 10));
  });

  restartBtn.addEventListener('click', function(){
    newGame(level);
  });
  nextBtn.addEventListener('click', function(){
    var next = Math.min(50, level+1);
    newGame(next);
  });

  newGame(1);
})();
</script>
</body>
</html>
