<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미로 게임 - 난이도 1~30</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
  }
  body {
    min-height: 100svh;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(10px, 4vw, 20px);
  }
  .card {
    background: #ffffff;
    border-radius: 18px;
    padding: clamp(16px, 4vw, 24px) clamp(16px, 5vw, 28px) clamp(20px, 5vw, 30px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(10px, 2.5vw, 14px);
  }
  h1 {
    font-size: clamp(17px, 4.5vw, 20px);
    margin: 0;
    color: #1e293b;
    text-align: center;
  }
  .level-row {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
  }
  .level-row label { font-size: 14px; color: #475569; white-space: nowrap; }
  .level-row input[type=range] { flex: 1; accent-color: #185FA5; min-width: 0; }
  .level-row span { font-weight: 600; min-width: 28px; text-align: right; color: #1e293b; }

  .stats {
    display: flex;
    gap: clamp(12px, 4vw, 20px);
    font-size: 13px;
    color: #64748b;
    flex-wrap: wrap;
    justify-content: center;
  }
  .stats b { color: #1e293b; }

  .canvas-wrap {
    width: 100%;
    max-width: 420px;
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: inset 0 0 0 2px #e2e8f0;
    background: #f8fafc;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  #winMsg {
    display: none;
    font-size: clamp(14px, 4vw, 16px);
    font-weight: 600;
    color: #0F6E56;
    text-align: center;
  }

  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button {
    border: 1px solid #cbd5e1;
    background: #f1f5f9;
    color: #1e293b;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    touch-action: manipulation;
  }
  button:hover { background: #e2e8f0; }
  button:active { transform: scale(0.96); }

  .dpad-grid {
    display: grid;
    grid-template-columns: repeat(3, clamp(40px, 12vw, 48px));
    grid-template-rows: repeat(3, clamp(40px, 12vw, 48px));
    gap: 5px;
    margin-top: 4px;
  }
  .dpad {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(17px, 4.5vw, 20px);
    font-weight: 700;
    padding: 0;
  }

  @media (max-width: 380px) {
    .stats { gap: 12px; font-size: 12px; }
    .level-row label { font-size: 13px; }
  }

  @media (hover: none) {
    button:hover { background: #f1f5f9; }
  }
</style>
</head>
<body>
<div class="card">
  <h1>미로 게임</h1>

  <div class="level-row">
    <label for="lvl">난이도</label>
    <input type="range" id="lvl" min="1" max="30" value="1" step="1">
    <span id="lvlOut">1</span>
  </div>

  <div class="stats">
    <span>이동 <b id="moves">0</b></span>
    <span>시간 <b id="time">0초</b></span>
  </div>

  <div class="canvas-wrap">
    <canvas id="cv"></canvas>
  </div>

  <div id="winMsg">🎉 클리어! 다음 레벨로 가보세요.</div>

  <div class="btn-row">
    <button id="restartBtn">다시 시작</button>
    <button id="nextBtn">다음 레벨</button>
  </div>

  <div class="dpad-grid">
    <div></div>
    <button class="dpad" data-dir="up">▲</button>
    <div></div>
    <button class="dpad" data-dir="left">◀</button>
    <div></div>
    <button class="dpad" data-dir="right">▶</button>
    <div></div>
    <button class="dpad" data-dir="down">▼</button>
    <div></div>
  </div>
</div>

<script>
(function(){
  var lvlInput = document.getElementById('lvl');
  var lvlOut = document.getElementById('lvlOut');
  var movesEl = document.getElementById('moves');
  var timeEl = document.getElementById('time');
  var winMsg = document.getElementById('winMsg');
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var canvasWrap = document.querySelector('.canvas-wrap');
  var restartBtn = document.getElementById('restartBtn');
  var nextBtn = document.getElementById('nextBtn');

  var level, cols, rows, cell, grid, px, py, moves, won, startTime, timerId;
  var CANVAS_SIZE = 420;
  var dpr = window.devicePixelRatio || 1;

  function currentDisplaySize(){
    return Math.max(200, Math.round(canvasWrap.clientWidth));
  }

  function applyCanvasSize(){
    CANVAS_SIZE = currentDisplaySize();
    cell = CANVAS_SIZE / cols;
    cv.width = CANVAS_SIZE * dpr;
    cv.height = CANVAS_SIZE * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function sizeForLevel(l){
    var s = 5 + Math.floor((l-1) * 0.9);
    if (s > 31) s = 31;
    return s;
  }

  function makeGrid(c, r){
    var g = [];
    for (var y=0; y<r; y++){
      var row = [];
      for (var x=0; x<c; x++){
        row.push({x:x, y:y, top:true, right:true, bottom:true, left:true, visited:false});
      }
      g.push(row);
    }
    return g;
  }

  function generateMaze(c, r){
    var g = makeGrid(c, r);
    var stack = [];
    var cur = g[0][0];
    cur.visited = true;
    stack.push(cur);
    while (stack.length){
      cur = stack[stack.length-1];
      var neighbors = [];
      var x = cur.x, y = cur.y;
      if (y > 0 && !g[y-1][x].visited) neighbors.push(['top', g[y-1][x]]);
      if (x < c-1 && !g[y][x+1].visited) neighbors.push(['right', g[y][x+1]]);
      if (y < r-1 && !g[y+1][x].visited) neighbors.push(['bottom', g[y+1][x]]);
      if (x > 0 && !g[y][x-1].visited) neighbors.push(['left', g[y][x-1]]);
      if (neighbors.length === 0){
        stack.pop();
        continue;
      }
      var pick = neighbors[Math.floor(Math.random()*neighbors.length)];
      var dir = pick[0], next = pick[1];
      if (dir === 'top'){ cur.top = false; next.bottom = false; }
      if (dir === 'right'){ cur.right = false; next.left = false; }
      if (dir === 'bottom'){ cur.bottom = false; next.top = false; }
      if (dir === 'left'){ cur.left = false; next.right = false; }
      next.visited = true;
      stack.push(next);
    }
    return g;
  }

  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.fillStyle = '#f8fafc';
    ctx.fillRect(0,0,cv.width,cv.height);

    ctx.strokeStyle = '#334155';
    ctx.lineWidth = Math.max(1.5, cell*0.06);
    ctx.lineCap = 'square';

    for (var y=0; y<rows; y++){
      for (var x=0; x<cols; x++){
        var c = grid[y][x];
        var x0 = x*cell, y0 = y*cell, x1 = x0+cell, y1 = y0+cell;
        ctx.beginPath();
        if (c.top){ ctx.moveTo(x0,y0); ctx.lineTo(x1,y0); }
        if (c.right){ ctx.moveTo(x1,y0); ctx.lineTo(x1,y1); }
        if (c.bottom){ ctx.moveTo(x0,y1); ctx.lineTo(x1,y1); }
        if (c.left){ ctx.moveTo(x0,y0); ctx.lineTo(x0,y1); }
        ctx.stroke();
      }
    }

    ctx.fillStyle = '#0F6E56';
    var pad = cell*0.2;
    ctx.fillRect((cols-1)*cell+pad, (rows-1)*cell+pad, cell-pad*2, cell-pad*2);

    ctx.fillStyle = '#185FA5';
    var pcx = px*cell + cell/2;
    var pcy = py*cell + cell/2;
    ctx.beginPath();
    ctx.arc(pcx, pcy, cell*0.28, 0, Math.PI*2);
    ctx.fill();
  }

  function updateStats(){
    movesEl.textContent = moves;
  }

  function startTimer(){
    stopTimer();
    startTime = Date.now();
    timerId = setInterval(function(){
      var s = Math.floor((Date.now()-startTime)/1000);
      timeEl.textContent = s + '초';
    }, 500);
  }
  function stopTimer(){
    if (timerId) clearInterval(timerId);
    timerId = null;
  }

  function newGame(l){
    level = l;
    lvlInput.value = l;
    lvlOut.textContent = l;
    var s = sizeForLevel(l);
    cols = s; rows = s;
    applyCanvasSize();
    grid = generateMaze(cols, rows);
    px = 0; py = 0;
    moves = 0;
    won = false;
    winMsg.style.display = 'none';
    updateStats();
    startTimer();
    draw();
  }

  function tryMove(dir){
    if (won) return;
    var c = grid[py][px];
    var nx = px, ny = py;
    if (dir === 'up' && !c.top) ny -= 1;
    else if (dir === 'down' && !c.bottom) ny += 1;
    else if (dir === 'left' && !c.left) nx -= 1;
    else if (dir === 'right' && !c.right) nx += 1;
    else return;
    px = nx; py = ny;
    moves += 1;
    updateStats();
    draw();
    if (px === cols-1 && py === rows-1){
      won = true;
      stopTimer();
      winMsg.style.display = 'block';
    }
  }

  var resizeTimer = null;
  window.addEventListener('resize', function(){
    if (!grid) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      applyCanvasSize();
      draw();
    }, 100);
  });

  document.addEventListener('keydown', function(e){
    var map = {ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right', w:'up', s:'down', a:'left', d:'right'};
    var dir = map[e.key];
    if (dir){
      e.preventDefault();
      tryMove(dir);
    }
  });

  document.querySelectorAll('.dpad').forEach(function(btn){
    btn.addEventListener('click', function(){
      tryMove(btn.getAttribute('data-dir'));
    });
  });

  lvlInput.addEventListener('input', function(){
    lvlOut.textContent = lvlInput.value;
  });
  lvlInput.addEventListener('change', function(){
    newGame(parseInt(lvlInput.value, 10));
  });

  restartBtn.addEventListener('click', function(){
    newGame(level);
  });
  nextBtn.addEventListener('click', function(){
    var next = Math.min(30, level+1);
    newGame(next);
  });

  newGame(1);
})();
</script>
</body>
</html>
